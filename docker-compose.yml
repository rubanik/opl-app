version: '3.8'
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: opl
      POSTGRES_PASSWORD: opl
      POSTGRES_DB: opl
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opl -d opl"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://opl:opl@db:5432/opl
      PHOTO_STORAGE_DIR: /app/photos
    volumes:
      - photodata:/app/photos
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8001:8001"

  frontend:
    build: ./frontend
    ports:
      - "8000:8000"
    depends_on:
      - backend

volumes:
  pgdata:
  photodata:
