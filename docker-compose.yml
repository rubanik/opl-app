version: '3.8'
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: opl
      POSTGRES_PASSWORD: opl
      POSTGRES_DB: opl
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opl -d opl"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio_client:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set opl http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing opl/opl-photos &&
      exit 0
      "

  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://opl:opl@db:5432/opl
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET: opl-photos
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "8001:8001"

  frontend:
    build: ./frontend
    ports:
      - "8000:8000"
    depends_on:
      - backend

volumes:
  pgdata:
  miniodata:
